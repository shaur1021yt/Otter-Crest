<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made by Shaur1021</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tide:#1B3A3F;
    --tide-deep:#122A2E;
    --sand-light:#FAF6EC;
    --driftwood:#9C8368;
    --coral:#E17B5F;
    --ink:#1A1A18;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    background:var(--tide-deep);
    color:var(--sand-light);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:440px;
    width:100%;
    text-align:center;
  }
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:0.16em;
    font-size:0.72rem;
    font-weight:600;
    color:var(--coral);
    margin-bottom:18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:2.2rem;
    margin-bottom:14px;
  }
  p.tag{
    color:rgba(250,246,236,0.68);
    font-weight:300;
    line-height:1.6;
    margin-bottom:36px;
  }
  .contact{
    border-top:1px solid rgba(250,246,236,0.15);
    padding-top:28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .contact a{
    color:var(--sand-light);
    text-decoration:none;
    font-size:1.05rem;
    font-weight:500;
    border-bottom:1px solid rgba(250,246,236,0.25);
    padding-bottom:2px;
    display:inline-block;
  }
  .lab{
    text-transform:uppercase;
    letter-spacing:0.1em;
    font-size:0.68rem;
    color:var(--driftwood);
    font-weight:600;
    margin-bottom:6px;
  }
  .back{
    margin-top:44px;
    font-size:0.85rem;
    color:rgba(250,246,236,0.5);
  }
  .back a{ color:var(--coral); border-bottom:1px solid rgba(225,123,95,0.4); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Website by</div>
    <h1>Shaur1021</h1>
    <p class="tag">Websites, SEO, and local marketing for small businesses &mdash; built by Booked Up Inc.</p>
    <div class="contact">
      <div>
        <div class="lab">Phone</div>
        <a href="tel:+15104073274">(510) 407-3274</a>
      </div>
      <div>
        <div class="lab">Email</div>
        <a href="mailto:shaur11002211@gmail.com">shaur11002211@gmail.com</a>
      </div>
    </div>
    <div class="back"><a href="index.html">&larr; Back to the site</a></div>
  </div>
</body>
</html>
